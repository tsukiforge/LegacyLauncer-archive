name: Build Legacy Launcer Archive

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  workflow_dispatch:

env:
  SHORT_BRAND: archive
  JAVA_VERSION: '21'

jobs:
  build:
    name: Build & Release
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build everything
        run: |
          ./gradlew :launcher:build :packages:portable:build :packages:installer:prepareInstaller --no-daemon -x test
        env:
          SHORT_BRAND: ${{ env.SHORT_BRAND }}

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Compile installer
        shell: powershell
        run: |
          $issDir = "packages/installer/build/innosetup/archive"
          # Cari path ISCC - handle Get-Command (ApplicationInfo.Source) dan Get-ChildItem (FileInfo.FullName)
          $isccPath = (Get-Command iscc.exe -ErrorAction SilentlyContinue).Source
          if (-not $isccPath) {
            $isccPath = Get-ChildItem "${env:ProgramFiles(x86)}" -Recurse -Filter "ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $isccPath) { Write-Host "::error::ISCC not found"; exit 1 }
          Write-Host "Compiling: $issDir/main.iss using $isccPath"
          & $isccPath "$issDir/main.iss"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-ChildItem -Path "$issDir" -Filter "*.exe" -Recurse | Select-Object FullName, Length | Format-Table

      - name: Extract version
        id: version
        run: |
          $version = git describe --tags --always --match "[0-9].*" 2>$null
          if (-not $version) { $version = "0.0.0" }
          echo "version=$version" >> $env:GITHUB_OUTPUT
          echo "Version: $version"

      - name: Determine tag
        id: tag
        run: |
          $ref = "${{ github.ref }}"
          if ($ref -like "refs/tags/*") {
            $tag = $ref -replace "refs/tags/", ""
            echo "tag=$tag" >> $env:GITHUB_OUTPUT
            echo "Using pushed tag: $tag"
          } else {
            $tag = "v${{ steps.version.outputs.version }}"
            echo "tag=$tag" >> $env:GITHUB_OUTPUT
            echo "Auto tag: $tag"
          }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "Legacy Launcer Archive ${{ steps.tag.outputs.tag }}"
          body: |
            ## 🚀 Legacy Launcer Archive ${{ steps.tag.outputs.tag }}

            ### ✨ Fitur
            - 🎨 Anime Theme UI dengan background kustom
            - ⚡ Auto-Optimize Low-End PC
            - 🔔 Update Checker dengan bell icon
            - 🖥️ Glassmorphism & Rounded UI
            - 🌐 Multi-language (EN/RU)

            ### 📦 Download
            - **Installer EXE**: File installer untuk Windows

            ---
            *Auto-generated by GitHub Actions*
          files: packages/installer/build/innosetup/archive/**/*.exe
          draft: ${{ github.ref_type != 'tag' }}
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: false
