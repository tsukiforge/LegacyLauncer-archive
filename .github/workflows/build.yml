name: Build Legacy Launcer Archive

on:
  push:
    branches: [ master, main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Type of release to create'
        required: true
        default: 'draft'
        type: choice
        options:
          - draft
          - prerelease
          - release

env:
  SHORT_BRAND: archive
  JAVA_VERSION: '21'

jobs:
  # ─── BUILD JOB ────────────────────────────────────────
  build:
    name: Build Launcher JAR
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract-version.outputs.version }}
      is_tag_push: ${{ steps.check-tag.outputs.is_tag }}
      commit_sha: ${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # fetch all history for git describe

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build with Gradle
        run: ./gradlew :launcher:build --no-daemon -x test
        env:
          SHORT_BRAND: ${{ env.SHORT_BRAND }}

      - name: Run tests
        run: ./gradlew :launcher:test --no-daemon
        env:
          SHORT_BRAND: ${{ env.SHORT_BRAND }}

      - name: Extract version from git
        id: extract-version
        run: |
          VERSION=$(git describe --tags --always --match "[0-9].*" 2>/dev/null || echo "0.0.0")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Detected version: $VERSION"

      - name: Check if tag push
        id: check-tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "is_tag=true" >> $GITHUB_OUTPUT
            echo "Tag push detected: ${{ github.ref }}"
          else
            echo "is_tag=false" >> $GITHUB_OUTPUT
            echo "Branch push detected: ${{ github.ref }}"
          fi

      - name: List build outputs
        run: ls -la launcher/build/libs/

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: LegacyLauncer-Archive-JAR
          path: launcher/build/libs/*.jar
          retention-days: 7
          if-no-files-found: error

  # ─── PACKAGE JOB ──────────────────────────────────────
  package:
    name: Package Installers
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        pkg: [ portable ]
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: LegacyLauncer-Archive-JAR
          path: launcher/build/libs/

      - name: Build portable package
        run: |
          ./gradlew :packages:portable:build --no-daemon
          echo "Portable build completed"

      - name: Prepare Inno Setup files
        run: |
          ./gradlew :packages:installer:prepareInstaller --no-daemon
          echo "Inno Setup preparation completed"
        env:
          SHORT_BRAND: ${{ env.SHORT_BRAND }}

      - name: List all packages
        run: |
          find . -name "*.zip" -o -name "*.tar.gz" -o -name "*.exe" -o -name "*.dmg" 2>/dev/null | head -20

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LegacyLauncer-Archive-Packages
          path: |
            packages/*/build/distributions/*
            packages/*/build/libs/*
            !packages/*/build/libs/*-sources.jar
          retention-days: 7
          if-no-files-found: ignore

  # ─── INSTALLER JOB (Windows) ──────────────────────────
  installer:
    name: Build Windows Installer (EXE)
    needs: [ build, package ]
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: LegacyLauncer-Archive-JAR
          path: launcher/build/libs/

      - name: Build portable & prepare Inno Setup files
        shell: powershell
        run: |
          Write-Host "=== Building portable package ==="
          .\gradlew :packages:portable:build --no-daemon
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::Portable build failed"; exit 1 }
          Write-Host "✅ Portable build completed"
          
          Write-Host "=== Preparing Inno Setup files ==="
          .\gradlew :packages:installer:prepareInstaller --no-daemon
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::prepareInstaller failed"; exit 1 }
          Write-Host "✅ Inno Setup preparation completed"
        env:
          SHORT_BRAND: ${{ env.SHORT_BRAND }}

      - name: Verify Inno Setup files exist
        shell: powershell
        run: |
          Write-Host "=== Checking Inno Setup files ==="
          $issDir = "packages/installer/build/innosetup/archive"
          if (-not (Test-Path "$issDir/main.iss")) {
            Write-Host "::error::main.iss NOT found in $issDir"
            Get-ChildItem -Path packages/installer/build/innosetup -Recurse -Filter "*.iss" | Select-Object FullName
            exit 1
          }
          Write-Host "✅ main.iss found at $issDir/main.iss"
          Get-ChildItem -Path "$issDir" | Select-Object Name | Format-Table

      - name: Install Inno Setup
        shell: powershell
        run: |
          Write-Host "Installing Inno Setup via Chocolatey..."
          choco install innosetup --no-progress -y 2>&1
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::choco install failed"; exit 1 }
          
          Write-Host "=== Finding ISCC ==="
          $isccPath = (Get-Command iscc.exe -ErrorAction SilentlyContinue).Source
          if ($isccPath) {
            Write-Host "✅ ISCC at: $isccPath"
          } else {
            $isccFile = Get-ChildItem -Path "${env:ProgramFiles(x86)}" -Recurse -Filter "ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($isccFile) {
              Write-Host "✅ ISCC found at: $($isccFile.FullName)"
            } else {
              Write-Host "::error::ISCC not found after choco install!"
              exit 1
            }
          }

      - name: Compile installer with ISCC
        shell: powershell
        run: |
          $issDir = "packages/installer/build/innosetup/archive"
          $issPath = "$issDir/main.iss"
          
          Write-Host "Compiling: $issPath"
          
          # Find ISCC path (works for both Get-Command and Get-ChildItem)
          $isccPath = (Get-Command iscc.exe -ErrorAction SilentlyContinue).Source
          if (-not $isccPath) {
            $isccFile = Get-ChildItem -Path "${env:ProgramFiles(x86)}" -Recurse -Filter "ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
            $isccPath = $isccFile.FullName
          }
          if (-not $isccPath) {
            Write-Host "::error::ISCC not found!"
            exit 1
          }
          
          Write-Host "Using ISCC: $isccPath"
          
          # List files before compilation for debugging
          Write-Host "=== Files before ISCC ==="
          Get-ChildItem -Path "$issDir" -Recurse | Select-Object FullName, Length | Format-Table -AutoSize
          
          # Run ISCC with explicit output directory (/O switch)
          # ISCC /O<path> sets output directory; we set it to $issDir
          $outputDir = Join-Path $issDir "Output"
          & $isccPath "$issPath" "/O$outputDir"
          $exitCode = $LASTEXITCODE
          
          Write-Host "ISCC exit code: $exitCode"
          
          if ($exitCode -ne 0) {
            Write-Host "::error::ISCC compilation failed with exit code $exitCode"
            exit 1
          }
          
          # Search for generated EXE in multiple locations
          Write-Host "=== Searching for generated EXE ==="
          $searchPaths = @(
            $issDir,
            $outputDir,
            (Get-Location).Path,
            "$env:TEMP",
            [System.IO.Path]::Combine($env:USERPROFILE, "Documents", "Inno Setup Output")
          )
          
          $allExes = @()
          foreach ($searchPath in $searchPaths) {
            $found = Get-ChildItem -Path $searchPath -Filter "*.exe" -Recurse -ErrorAction SilentlyContinue | Where-Object { $_.Name -like "*Installer*" -or $_.Name -like "*Launcher*" }
            if ($found) {
              Write-Host "Found EXE in $searchPath:"
              $found | Select-Object FullName, Length | Format-Table -AutoSize
              $allExes += $found
            }
          }
          
          if ($allExes.Count -eq 0) {
            Write-Host "::error::No installer EXE found anywhere!"
            Write-Host "Searching ALL .exe files in workspace..."
            Get-ChildItem -Path (Get-Location).Path -Filter "*.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object FullName, Length | Format-Table -AutoSize
            exit 1
          }
          
          # Copy EXE to expected upload location
          $targetDir = "$issDir"
          foreach ($exe in $allExes) {
            $destPath = Join-Path $targetDir $exe.Name
            Copy-Item -Path $exe.FullName -Destination $destPath -Force
            Write-Host "Copied: $($exe.FullName) -> $destPath"
          }
          
          Write-Host "=== Final EXE files in $issDir ==="
          Get-ChildItem -Path "$issDir" -Filter "*.exe" -Recurse | Select-Object FullName, Length | Format-Table -AutoSize

      - name: Upload installer EXE
        uses: actions/upload-artifact@v4
        with:
          name: LegacyLauncer-Archive-Installer
          path: packages/installer/build/innosetup/archive/**/*.exe
          retention-days: 7
          if-no-files-found: error

  # ─── RELEASE JOB ──────────────────────────────────────
  release:
    name: Auto Release
    if: |
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/master' ||
       startsWith(github.ref, 'refs/tags/v') ||
       github.event_name == 'workflow_dispatch')
    needs: [ build, package, installer ]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display artifacts
        run: |
          echo "=== Artifacts ==="
          ls -laR artifacts/
          echo "=== Version ==="
          echo "Version: ${{ needs.build.outputs.version }}"
          echo "Is tag push: ${{ needs.build.outputs.is_tag_push }}"

      - name: Determine tag name
        id: tag-name
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            # Use the pushed tag name
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
            echo "Using pushed tag: $TAG_NAME"
          else
            # Auto-create tag from version
            VERSION="${{ needs.build.outputs.version }}"
            if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
              TAG_NAME="v${VERSION}"
              echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
              echo "Auto-creating tag: $TAG_NAME"
            else
              TAG_NAME="build-${GITHUB_SHA:0:8}"
              echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
              echo "Fallback tag: $TAG_NAME"
            fi
          fi

      - name: Create Git tag (if not a tag push)
        id: create-tag
        if: needs.build.outputs.is_tag_push != 'true'
        run: |
          TAG_NAME="${{ steps.tag-name.outputs.tag_name }}"
          if ! git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            git config user.name "github-actions"
            git config user.email "github-actions@github.com"
            git tag "$TAG_NAME" "${{ needs.build.outputs.commit_sha }}"
            git push origin "$TAG_NAME"
            echo "Created and pushed tag: $TAG_NAME"
          else
            echo "Tag $TAG_NAME already exists, skipping creation"
          fi

      - name: Determine release type
        id: release-type
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "draft=false" >> $GITHUB_OUTPUT
            echo "prerelease=false" >> $GITHUB_OUTPUT
            echo "Type: Full Release (tag push)"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            RTYPE="${{ github.event.inputs.release_type }}"
            if [[ "$RTYPE" == "draft" ]]; then
              echo "draft=true" >> $GITHUB_OUTPUT
              echo "prerelease=false" >> $GITHUB_OUTPUT
            elif [[ "$RTYPE" == "prerelease" ]]; then
              echo "draft=false" >> $GITHUB_OUTPUT
              echo "prerelease=true" >> $GITHUB_OUTPUT
            else
              echo "draft=false" >> $GITHUB_OUTPUT
              echo "prerelease=false" >> $GITHUB_OUTPUT
            fi
            echo "Type: ${RTYPE:-release} (manual)"
          else
            echo "draft=false" >> $GITHUB_OUTPUT
            echo "prerelease=false" >> $GITHUB_OUTPUT
            echo "Type: Full Release (master push)"
          fi

      - name: Organize release files (only installer EXE)
        id: organize
        run: |
          mkdir -p release-assets
          echo "=== Collecting installer EXE only ==="
          
          # Only the Inno Setup installer EXE — exclude Java runtime binaries
          find artifacts/ -name "*Installer.exe" -exec cp {} release-assets/ \; 2>/dev/null || true
          
          echo "=== Release Assets ==="
          ls -lh release-assets/
          echo "=== Total size ==="
          du -sh release-assets/ 2>/dev/null || echo "(du not available)"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"
        with:
          tag_name: ${{ steps.tag-name.outputs.tag_name }}
          name: "Legacy Launcer Archive ${{ steps.tag-name.outputs.tag_name }}"
          body: |
            ## 🚀 Legacy Launcer Archive ${{ steps.tag-name.outputs.tag_name }}

            ### ✨ Fitur
            - 🎨 Anime Theme UI dengan background kustom
            - ⚡ Auto-Optimize Low-End PC
            - 🔔 Update Checker dengan bell icon
            - 🖥️ Glassmorphism & Rounded UI
            - 🌐 Multi-language (EN/RU)

            ### 📦 Download
            - **Installer EXE**: File installer untuk Windows (satu-satunya asset)

            ---
            *Auto-generated by GitHub Actions*
          files: release-assets/*
          draft: ${{ steps.release-type.outputs.draft }}
          prerelease: ${{ steps.release-type.outputs.prerelease }}
          generate_release_notes: true
          fail_on_unmatched_files: false
