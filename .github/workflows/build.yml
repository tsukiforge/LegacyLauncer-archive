name: Build Legacy Launcer Archive

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  workflow_dispatch:

env:
  SHORT_BRAND: archive
  JAVA_VERSION: '21'

jobs:
  build:
    name: Build Launcher
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build JAR
        run: ./gradlew :launcher:build --no-daemon -x test
        env:
          SHORT_BRAND: ${{ env.SHORT_BRAND }}

      - name: Extract version
        id: version
        run: |
          VERSION=$(git describe --tags --always --match "v[0-9]*" 2>/dev/null || echo "0.0.0")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        env:
          ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: "Legacy Launcer Archive ${{ steps.version.outputs.version }}"
          body: |
            ## 🚀 Legacy Launcer Archive ${{ steps.version.outputs.version }}

            ### ✨ Fitur
            - 🎨 Anime Theme UI dengan background kustom
            - ⚡ Auto-Optimize Low-End PC
            - 🔔 Update Checker dengan bell icon
            - 🖥️ Glassmorphism & Rounded UI
            - 🌐 Multi-language (EN/RU)

            ### 📦 Download
            - **Launcher JAR**: File launcher utama

            ---
            *Auto-generated by GitHub Actions*
          files: launcher/build/libs/*.jar
          draft: false
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: false
