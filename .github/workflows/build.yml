name: Build Legacy Launcher

on:
  push:
    branches: [ master, main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:
    inputs:
      release:
        description: 'Create a release artifact?'
        required: false
        default: false
        type: boolean

jobs:
  build:
    name: Build Launcher JAR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build with Gradle
        env:
          SHORT_BRAND: archive
        run: ./gradlew :launcher:build --no-daemon -x test

      - name: Run tests
        run: ./gradlew :launcher:test --no-daemon

      - name: List build outputs
        run: ls -la launcher/build/libs/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: LegacyLauncer-Archive-JAR
          path: |
            launcher/build/libs/*.jar
          retention-days: 7
          if-no-files-found: error

  # Optional: Build platform-specific packages
  package:
    name: Package Installers
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest ]
        # Add windows-latest if you have Windows packaging scripts
        # os: [ ubuntu-latest, windows-latest ]
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: LegacyLauncer-Archive-JAR
          path: launcher/build/libs/

      - name: Build packages (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          ./gradlew :packages:portable:build --no-daemon || true
          echo "Package build completed (may have warnings)"

      - name: List all packages
        run: |
          find . -name "*.zip" -o -name "*.tar.gz" -o -name "*.exe" -o -name "*.dmg" | head -20

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LegacyLauncer-Archive-Packages-${{ runner.os }}
          path: |
            packages/*/build/distributions/*
            packages/*/build/libs/*
            !packages/*/build/libs/*-sources.jar
          retention-days: 7
          if-no-files-found: ignore

  # Automated release on tag push
  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ build, package ]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure of downloaded files
        run: ls -laR artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*
          generate_release_notes: true
          draft: false
          prerelease: false
